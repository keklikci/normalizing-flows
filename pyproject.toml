[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normalizing-flows"
version = "0.1.0"
description = "Beta-VAE experiments with normalizing flows for variational inference and generative modeling"
readme = "README.md"
requires-python = ">=3.8,<3.10"
dependencies = [
    "matplotlib==3.4.2",
    "numpy==1.19.5",
    "pandas==1.3.3",
    "scikit-learn==0.24.2",
    "scipy==1.7.1",
    "seaborn==0.11.2",
    "tensorflow==2.5.0",
    "tensorflow-probability==0.13.0",
    "xlrd==2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/normalizing_flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
