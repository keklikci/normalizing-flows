[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normalizing-flows"
version = "0.1.0"
description = "Beta-VAE experiments with normalizing flows for variational inference and generative modeling"
readme = "README.md"
requires-python = ">=3.8,<3.10"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[dependency-groups]
dev = [
    "pytest>=7,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/normalizing_flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"
exclude = ["notebooks"]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
